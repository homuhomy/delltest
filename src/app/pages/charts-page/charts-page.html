
<div class="chart-body">
    <div class="chart-container">
        <canvas
            baseChart
            [type]="lineChartType"
            [options]="lineChartOptions"
            [data]="lineChartData"
        ></canvas>
    </div>
    <div class="chart-container">
        <canvas
            baseChart
            [type]="pieChartType"
            [options]="pieChartOptions"
            [data]="pieChartData"
        ></canvas>
    </div>
</div>
