<div class="card-container">
    <mat-card appearance="outlined" class="card">
        <mat-card-header>
                <mat-card-title>Add Report</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <form [formGroup]="reportForm" (ngSubmit)="onSubmit()">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Report Name</mat-label>
                        <input matInput formControlName="title" placeholder="Enter title">
                        @if(reportForm.get('title')?.hasError('required')&& reportForm.get('title')?.touched) {
                            <mat-error>Title is required</mat-error>
                        }
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Date</mat-label>
                        <input matInput [matDatepicker]="reportDatePicker" formControlName="date" placeholder="Enter date">
                        <mat-datepicker-toggle matSuffix [for]="reportDatePicker"> </mat-datepicker-toggle>
                        <mat-datepicker #reportDatePicker></mat-datepicker>

                        @if(reportForm.get('date')?.hasError('required')&& reportForm.get('date')?.touched) {
                            <mat-error>Please select date</mat-error>
                        }
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Category</mat-label>
                        <mat-select formControlName="category" placeholder="select category">
                            <mat-option value="Security">SVT</mat-option>
                            <mat-option value="Property">ATEEZ</mat-option>
                            <mat-option value="Safety">Newjeans</mat-option>
                            <mat-option value="Others">Illit</mat-option>
                        </mat-select>
                    </mat-form-field>
                    
                    <mat-card-actions class="action-buttons">
                        <button mat-raised-button type="button" routerLink="/reports">Back</button>
                        <button mat-raised-button type="submit" [disabled]="!reportForm.valid">Submit</button>
                    </mat-card-actions>
                </form>
            </mat-card-content>
    </mat-card>
    
</div>
